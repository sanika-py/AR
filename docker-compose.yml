services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AWAZRAKSHAK_MODEL_PATH: /models
      AWAZRAKSHAK_API_HOST: 0.0.0.0
      AWAZRAKSHAK_API_PORT: 8000
      HF_HOME: /app/.cache/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DATABASE_URL: sqlite:////app/.awazrakshak-data/awazrakshak.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a random secret of at least 32 characters}
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
      - app_data:/app/.awazrakshak-data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_USE_MOCK: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  app_data:
